[project]
name = "hybrid-rag-lab"
version = "0.1.0"
description = "A lightweight, explainable lab for comparing hybrid and agentic RAG modes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "FlagEmbedding>=1.4,<2",
    "transformers>=4.44.2,<5",
    "isort>=8.0.1",
    "json-repair>=0.59,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "networkx>=3.6,<4",
    "openai>=2.44,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.28,<2",
    "rapidfuzz>=3.14.5",
    "rich>=14,<15",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.11,<1",
    "torch>=2.13,<2.14",
    "typer>=0.16,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
hrag = "hybrid_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "python-dotenv>=1,<2",
    "ragas>=0.4,<1",
    "reportlab>=4.4,<5",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_rag"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
