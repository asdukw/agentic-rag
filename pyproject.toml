[project]
name = "hybrid-rag"
version = "0.1.0"
description = "A lightweight, explainable LightRAG-style graph RAG implementation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "networkx>=3.6,<4",
    "openai>=2.44,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "rich>=14,<15",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.58,<2",
    "tiktoken>=0.11,<1",
    "typer>=0.16,<1",
]

[project.scripts]
hybrid-rag = "hybrid_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "reportlab>=4.4,<5",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_rag"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
