repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check .
        language: system
        always_run: true
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format .
        language: system
        always_run: true
        pass_filenames: false

      - id: web-format
        name: web format
        entry: bun --cwd web run format
        language: system
        always_run: true
        pass_filenames: false
